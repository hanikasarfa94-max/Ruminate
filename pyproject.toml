[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ruminate-local"
version = "0.6.0"
description = "Local-first evidence and research workflows for AI hosts"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Ruminate contributors" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp>=2,<3",
    "pillow>=13,<14",
    "pypdf>=7,<8",
    "pypdfium2>=5,<6",
    "trafilatura>=2.3,<3",
]

[project.scripts]
ruminate = "ruminate.cli:main"

[project.urls]
Homepage = "https://github.com/hanikasarfa94-max/Ruminate"
Repository = "https://github.com/hanikasarfa94-max/Ruminate"
Issues = "https://github.com/hanikasarfa94-max/Ruminate/issues"
Changelog = "https://github.com/hanikasarfa94-max/Ruminate/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["ruminate"]

[tool.hatch.build.targets.sdist]
include = [
    "/ruminate", "/plugins", "/scripts", "/tests", "/docs",
    "/.github", "/.editorconfig", "/.gitattributes", "/.gitignore",
    "/.env.example", "/.python-version", "/AGENTS.md", "/README*.md",
    "/CONTRIBUTING.md", "/CHANGELOG.md", "/SECURITY.md", "/SUPPORT.md",
    "/CODE_OF_CONDUCT.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml", "/uv.lock", "/install.sh",
]
exclude = ["/docs/design", "/docs/evidence/private"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ruminate"]
