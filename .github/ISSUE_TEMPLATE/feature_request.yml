name: Feature request / 功能建议
description: Suggest an improvement to the research workflow.
title: "[Feature] "
body:
  - type: textarea
    id: need
    attributes:
      label: Problem or workflow / 场景
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议
      description: Describe the result you would like and any alternatives considered.
    validations:
      required: true
